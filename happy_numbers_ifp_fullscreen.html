<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Numbers Arena - IFP Tactile Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #1a202c; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        /* Header & Panel Kontrol */
        header { 
            text-align: center; 
            padding: 12px; 
            background: #2d3748; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }
        h1 { 
            margin: 0 0 6px 0; 
            font-size: 20px; 
            color: #f6e05e; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
        }
        
        .control-panel { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            align-items: center; 
            background: #1a202c; 
            padding: 8px; 
            border-radius: 6px; 
            flex-wrap: wrap;
        }
        .control-group { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .control-label { 
            font-weight: bold; 
            font-size: 13px; 
            color: #a0aec0; 
        }
        
        .btn-toggle { 
            padding: 6px 12px; 
            font-size: 12px; 
            font-weight: bold; 
            border: 2px solid #4a5568; 
            background: #2d3748; 
            color: #e2e8f0; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .btn-toggle:hover {
            background-color: #4a5568;
        }
        .btn-toggle.active { 
            background: #3182ce; 
            border-color: #2b6cb0; 
            box-shadow: 0 0 8px rgba(49, 130, 206, 0.5); 
        }
        .btn-difficulty.active { 
            background: #dd6b20; 
            border-color: #c05621; 
            box-shadow: 0 0 8px rgba(221, 107, 32, 0.5); 
        }
        
        .btn-action {
            padding: 8px 16px; 
            font-size: 13px; 
            font-weight: bold; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        #btnMulai { 
            background-color: #38a169; 
            color: white; 
        }
        #btnMulai:hover {
            background-color: #2f855a;
        }
        #btnReset {
            background-color: #718096;
            color: white;
        }
        #btnReset:hover {
            background-color: #4a5568;
        }
        #btnFullscreen {
            background-color: #4a5568;
            color: #f6e05e;
            border: 1px solid #f6e05e;
        }
        #btnFullscreen:hover {
            background-color: #2d3748;
        }

        .info-misi { 
            font-size: 13px; 
            color: #e2e8f0; 
            margin-top: 5px; 
            font-style: italic; 
        }
        #global-msg { 
            background: #38a169; 
            color: #fff; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 15px; 
            display: none; 
            margin-top: 6px; 
            text-align: center; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px dashed #ffffff;
        }

        /* Arena Permainan 2 Player */
        .game-arena { 
            display: flex; 
            flex: 1; 
            gap: 12px; 
            height: 65vh; 
        }
        .player-side { 
            flex: 1; 
            background: #2d3748; 
            border-radius: 12px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            border: 4px solid #4a5568; 
            position: relative;
            transition: all 0.3s ease;
        }
        #p1-side { border-color: #3182ce; }
        #p2-side { border-color: #e53e3e; }
        
        .player-title { 
            text-align: center; 
            font-size: 16px; 
            margin-bottom: 4px; 
            font-weight: bold; 
            letter-spacing: 1px;
        }
        #p1-side .player-title { color: #63b3ed; }
        #p2-side .player-title { color: #feb2b2; }

        .start-badge { 
            text-align: center; 
            font-size: 28px; 
            font-weight: bold; 
            background: #1a202c; 
            padding: 6px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
        }
        #p1-start { color: #3182ce; border: 2px solid #3182ce; }
        #p2-start { color: #e53e3e; border: 2px solid #e53e3e; }

        /* Log / Papan Tulis Langkah */
        .log-container { 
            flex: 1; 
            background: #1a202c; 
            border-radius: 8px; 
            padding: 8px; 
            overflow-y: auto; 
            margin-bottom: 8px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            min-height: 80px; 
            border: 1px solid #4a5568;
        }
        .log-entry { 
            background: #2d3748; 
            padding: 4px 6px; 
            margin-bottom: 4px; 
            border-radius: 4px; 
            border-left: 3px solid #ecc94b; 
        }
        .log-entry.win { 
            border-left-color: #38a169; 
            background: #22543d; 
            font-weight: bold; 
        }

        /* Alur Kerja Tiga Input Matematika */
        .math-interface { 
            background: #232d3f; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #4a5568; 
        }
        .formula-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
            margin-bottom: 8px; 
            font-size: 15px; 
        }
        
        .num-input { 
            width: 100px; 
            padding: 8px 4px; 
            font-size: 14px; 
            text-align: center; 
            font-weight: bold; 
            border-radius: 5px; 
            border: 2px solid #718096; 
            background: #fff; 
            color: #000; 
            cursor: pointer;
        }
        .num-input:focus { 
            border-color: #ecc94b; 
            outline: none; 
        }
        .num-input.active-focus { 
            border-color: #ecc94b; 
            background-color: #feebc8; 
            box-shadow: 0 0 8px #ecc94b;
        }
        .num-input.error { 
            border-color: #e53e3e; 
            background-color: #fff5f5; 
            animation: shake 0.3s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        /* Papan Keypad Sentuh IFP */
        .ifp-keypad { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 4px; 
            margin-bottom: 8px; 
        }
        .key-btn { 
            padding: 12px 0; 
            font-size: 16px; 
            font-weight: bold; 
            background: #4a5568; 
            border: none; 
            color: white; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: center; 
            user-select: none;
            touch-action: manipulation;
        }
        .key-btn:active { 
            background: #718096; 
        }
        .key-btn.symbol { 
            background: #2b6cb0; 
        }
        .key-btn.symbol:active {
            background: #2b5cb0;
        }
        .key-btn.clear { 
            background: #c53030; 
        }
        .key-btn.clear:active {
            background: #9b2c2c;
        }

        .btn-proses { 
            width: 100%; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            background: #805ad5; 
            border: none; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            touch-action: manipulation;
        }
        .btn-proses:active {
            background: #6b46c1;
        }
        .btn-proses:disabled, .key-btn:disabled { 
            background: #2d3748; 
            color: #718096; 
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

    <header>
        <h1>HAPPY NUMBERS COMPETE CENTER (TACTILE IFP VERSION)</h1>
        
        <div class="control-panel">
            <div class="control-group">
                <span class="control-label">MODE GAME:</span>
                <button class="btn-toggle active" id="modeHappy" onclick="setGameMode('happy')">HAPPY (➔ 1)</button>
                <button class="btn-toggle" id="modeUnhappy" onclick="setGameMode('unhappy')">UNHAPPY (➔ 4)</button>
            </div>
            
            <div class="control-group">
                <span class="control-label">KESULITAN:</span>
                <button class="btn-toggle btn-difficulty active" id="diff-mudah" onclick="setDifficulty('mudah')">MUDAH</button>
                <button class="btn-toggle btn-difficulty" id="diff-sedang" onclick="setDifficulty('sedang')">SEDANG</button>
                <button class="btn-toggle btn-difficulty" id="diff-sulit" onclick="setDifficulty('sulit')">SULIT</button>
            </div>
            
            <button id="btnMulai" class="btn-action" onclick="mulaiPertandingan()">Acak Game & Mulai!</button>
            <button id="btnReset" class="btn-action" onclick="resetGame()">Reset</button>
            <button id="btnFullscreen" class="btn-action" onclick="toggleFullscreen()">💻 Fullscreen</button>
        </div>
        
        <div class="info-misi" id="infoMisi">Kedua pemain mendapat angka berbeda tetapi memiliki total langkah penyelesaian yang sama persis (Fair Play). Siapa cepat dia menang!</div>
        <div id="global-msg"></div>
    </header>

    <div class="game-arena">
        <!-- PLAYER 1 -->
        <div class="player-side" id="p1-side">
            <div class="player-title">PLAYER 1 (BIRU)</div>
            <div class="start-badge" id="p1-start">??</div>
            <div class="log-container" id="p1-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p1-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(1, 'p1-in1')">
                    <span>=</span>
                    <input type="text" id="p1-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(1, 'p1-in2')">
                    <span>=</span>
                    <input type="text" id="p1-in3" class="num-input" style="width: 75px;" placeholder="Hasil" readonly onclick="setFokusInput(1, 'p1-in3')">
                </div>
                
                <div class="ifp-keypad">
                    <button class="key-btn" id="p1-k1" onclick="inputKey(1, '1')" disabled>1</button>
                    <button class="key-btn" id="p1-k2" onclick="inputKey(1, '2')" disabled>2</button>
                    <button class="key-btn" id="p1-k3" onclick="inputKey(1, '3')" disabled>3</button>
                    <button class="key-btn" id="p1-k4" onclick="inputKey(1, '4')" disabled>4</button>
                    <button class="key-btn" id="p1-k5" onclick="inputKey(1, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p1-ks1" onclick="inputKey(1, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p1-k6" onclick="inputKey(1, '6')" disabled>6</button>
                    <button class="key-btn" id="p1-k7" onclick="inputKey(1, '7')" disabled>7</button>
                    <button class="key-btn" id="p1-k8" onclick="inputKey(1, '8')" disabled>8</button>
                    <button class="key-btn" id="p1-k9" onclick="inputKey(1, '9')" disabled>9</button>
                    <button class="key-btn" id="p1-k0" onclick="inputKey(1, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p1-ks2" onclick="inputKey(1, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p1-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(1)" disabled>Hapus</button>
                    <button id="p1-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(1)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>

        <!-- PLAYER 2 -->
        <div class="player-side" id="p2-side">
            <div class="player-title">PLAYER 2 (MERAH)</div>
            <div class="start-badge" id="p2-start">??</div>
            <div class="log-container" id="p2-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p2-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(2, 'p2-in1')">
                    <span>=</span>
                    <input type="text" id="p2-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(2, 'p2-in2')">
                    <span>=</span>
                    <input type="text" id="p2-in3" class="num-input" style="width: 75px;" placeholder="Hasil" readonly onclick="setFokusInput(2, 'p2-in3')">
                </div>
                
                <div class="ifp-keypad">
                    <button class="key-btn" id="p2-k1" onclick="inputKey(2, '1')" disabled>1</button>
                    <button class="key-btn" id="p2-k2" onclick="inputKey(2, '2')" disabled>2</button>
                    <button class="key-btn" id="p2-k3" onclick="inputKey(2, '3')" disabled>3</button>
                    <button class="key-btn" id="p2-k4" onclick="inputKey(2, '4')" disabled>4</button>
                    <button class="key-btn" id="p2-k5" onclick="inputKey(2, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p2-ks1" onclick="inputKey(2, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p2-k6" onclick="inputKey(2, '6')" disabled>6</button>
                    <button class="key-btn" id="p2-k7" onclick="inputKey(2, '7')" disabled>7</button>
                    <button class="key-btn" id="p2-k8" onclick="inputKey(2, '8')" disabled>8</button>
                    <button class="key-btn" id="p2-k9" onclick="inputKey(2, '9')" disabled>9</button>
                    <button class="key-btn" id="p2-k0" onclick="inputKey(2, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p2-ks2" onclick="inputKey(2, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p2-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(2)" disabled>Hapus</button>
                    <button id="p2-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(2)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // Setiap entri dijamin memiliki jumlah rantai kalkulasi yang sama persis ke target!
    const databaseHappy = {
        happy: {
            mudah:  [ 
                {p1: "13", p2: "31"}, // 2 langkah ke 1 (13->10->1 vs 31->10->1)
                {p1: "68", p2: "86"}  // 2 langkah ke 1 (68->100->1 vs 86->100->1)
            ],
            sedang: [ 
                {p1: "23", p2: "32"}, // 3 langkah ke 1 (23->13->10->1 vs 32->13->10->1)
                {p1: "28", p2: "82"}  // 3 langkah ke 1 (28->68->100->1 vs 82->68->100->1)
            ],
            sulit:  [ 
                {p1: "19", p2: "91"}, // 4 langkah ke 1 (19->82->68->100->1 vs 91->82->68->100->1)
                {p1: "49", p2: "94"}  // 4 langkah ke 1 (49->97->130->10->1 vs 94->97->130->10->1)
            ]
        },
        unhappy: {
            mudah:  [ 
                {p1: "11", p2: "24"}, // 2 langkah ke 4 (11->2->4 vs 24->20->4)
                {p1: "110", p2: "42"} // 2 langkah ke 4 (110->2->4 vs 42->20->4)
            ],
            sedang: [ 
                {p1: "145", p2: "311"}, // 3 langkah ke 4 (145->42->20->4 vs 311->11->2->4)
                {p1: "224", p2: "131"}  // 3 langkah ke 4 (224->24->20->4 vs 131->11->2->4)
            ],
            sulit:  [ 
                {p1: "89", p2: "179"}, // 4 langkah ke 4 (89->145->42->20->4 vs 179->131->11->2->4)
                {p1: "98", p2: "971"}  // 4 langkah ke 4 (98->145->42->20->4 vs 971->131->11->2->4)
            ]
        }
    };

    let modeDipilih = "happy";
    let kesulitanDipilih = "mudah";
    
    // Status Permainan Independen
    let p1AngkaSaatIni = "";
    let p2AngkaSaatIni = "";
    let p1Langkah = 0;
    let p2Langkah = 0;
    let gameAktif = false;
    let targetFinis = "1";

    let p1InputFokus = "";
    let p2InputFokus = "";

    function setGameMode(mode) {
        if (gameAktif) return;
        modeDipilih = mode;
        targetFinis = (mode === "happy") ? "1" : "4";
        document.getElementById('modeHappy').classList.toggle('active', mode === 'happy');
        document.getElementById('modeUnhappy').classList.toggle('active', mode === 'unhappy');
    }

    function setDifficulty(diff) {
        if (gameAktif) return;
        kesulitanDipilih = diff;
        document.getElementById('diff-mudah').classList.toggle('active', diff === 'mudah');
        document.getElementById('diff-sedang').classList.toggle('active', diff === 'sedang');
        document.getElementById('diff-sulit').classList.toggle('active', diff === 'sulit');
    }

    function mulaiPertandingan() {
        hideError();
        const kumpulanData = databaseHappy[modeDipilih][kesulitanDipilih];
        const opsiTerpilih = kumpulanData[Math.floor(Math.random() * kumpulanData.length)];

        p1AngkaSaatIni = opsiTerpilih.p1;
        p2AngkaSaatIni = opsiTerpilih.p2;
        p1Langkah = 0;
        p2Langkah = 0;
        gameAktif = true;

        document.getElementById('p1-start').innerText = opsiTerpilih.p1;
        document.getElementById('p2-start').innerText = opsiTerpilih.p2;

        document.getElementById('p1-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p1}</div>`;
        document.getElementById('p2-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p2}</div>`;

        // Atur fokus default awal ke kolom pertama masing-masing player
        setFokusInput(1, 'p1-in1');
        setFokusInput(2, 'p2-in1');

        aktifkanForm(1, true);
        aktifkanForm(2, true);
        
        document.getElementById('btnReset').disabled = false;
    }

    function resetGame() {
        gameAktif = false;
        p1AngkaSaatIni = "";
        p2AngkaSaatIni = "";
        p1Langkah = 0;
        p2Langkah = 0;

        document.getElementById('p1-start').innerText = "??";
        document.getElementById('p2-start').innerText = "??";
        document.getElementById('p1-log').innerHTML = "";
        document.getElementById('p2-log').innerHTML = "";

        // Bersihkan input fokus
        if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
        if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');
        p1InputFokus = "";
        p2InputFokus = "";

        aktifkanForm(1, false);
        aktifkanForm(2, false);
        
        // Bersihkan nilai kolom input
        document.getElementById("p1-in1").value = "";
        document.getElementById("p1-in2").value = "";
        document.getElementById("p1-in3").value = "";
        document.getElementById("p2-in1").value = "";
        document.getElementById("p2-in2").value = "";
        document.getElementById("p2-in3").value = "";

        hideError();
    }

    function setFokusInput(player, inputId) {
        if (!gameAktif) return;

        // Hapus tanda aktif lama
        if (player === 1) {
            if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
            p1InputFokus = inputId;
        } else {
            if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');
            p2InputFokus = inputId;
        }
        // Beri tanda warna ke kolom baru yang dipilih
        document.getElementById(inputId).classList.add('active-focus');
    }

    // Fungsi menangkap ketukan tombol virtual keypad layar IFP
    function inputKey(player, char) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        targetElement.value += char;
    }

    function clearKey(player) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        let val = targetElement.value;
        targetElement.value = val.substring(0, val.length - 1); // Hapus karakter terakhir
    }

    function aktifkanForm(player, status) {
        document.getElementById(`p${player}-in1`).disabled = !status;
        document.getElementById(`p${player}-in2`).disabled = !status;
        document.getElementById(`p${player}-in3`).disabled = !status;
        document.getElementById(`p${player}-btn`).disabled = !status;
        document.getElementById(`p${player}-kc`).disabled = !status;
        
        // Aktifkan / Nonaktifkan tombol keypad numerik
        for(let i=0; i<=9; i++) { 
            document.getElementById(`p${player}-k${i}`).disabled = !status; 
        }
        document.getElementById(`p${player}-ks1`).disabled = !status;
        document.getElementById(`p${player}-ks2`).disabled = !status;
        
        if (status) {
            document.getElementById(`p${player}-in1`).value = "";
            document.getElementById(`p${player}-in2`).value = "";
            document.getElementById(`p${player}-in3`).value = "";
            document.getElementById(`p${player}-in1`).classList.remove('error');
            document.getElementById(`p${player}-in2`).classList.remove('error');
            document.getElementById(`p${player}-in3`).classList.remove('error');
        }
    }

    function eksekusiLangkah(player) {
        if (!gameAktif) return;
        hideError();

        let angkaSaatIni = (player === 1) ? p1AngkaSaatIni : p2AngkaSaatIni;
        let in1 = document.getElementById(`p${player}-in1`);
        let in2 = document.getElementById(`p${player}-in2`);
        let in3 = document.getElementById(`p${player}-in3`);

        in1.classList.remove('error');
        in2.classList.remove('error');
        in3.classList.remove('error');

        let digits = angkaSaatIni.split('');

        // 1. Kunci Jawaban Input 1 (Jabaran Pangkat, e.g., "1^2+9^2" atau "7^2")
        let solutionIn1 = digits.map(d => `${d}^2`).join('+');
        let solutionIn1Alt = digits.map(d => `${d}^2`).join(' + ');

        // 2. Kunci Jawaban Input 2 (Hasil Kuadrat Individu, e.g., "1+81" atau "49")
        let solutionIn2 = digits.map(d => Math.pow(parseInt(d), 2)).join('+');
        let solutionIn2Alt = digits.map(d => Math.pow(parseInt(d), 2)).join(' + ');

        // 3. Kunci Jawaban Input 3 (Total Akhir Penjumlahan, e.g., "82" atau "49")
        let solutionIn3 = digits.reduce((sum, d) => sum + Math.pow(parseInt(d), 2), 0).toString();

        let userIn1 = in1.value.trim();
        let userIn2 = in2.value.trim();
        let userIn3 = in3.value.trim();

        let valid = true;

        if (userIn1 !== solutionIn1 && userIn1 !== solutionIn1Alt) { in1.classList.add('error'); valid = false; }
        if (userIn2 !== solutionIn2 && userIn2 !== solutionIn2Alt) { in2.classList.add('error'); valid = false; }
        if (userIn3 !== solutionIn3) { in3.classList.add('error'); valid = false; }

        if (!valid) {
            showError(`Formula Player ${player} belum tepat!`);
            return;
        }

        // Jika validasi sukses, simpan langkah secara langsung (Adu Kecepatan Real-time!)
        let logFormatText = `${userIn1} = ${userIn2} = ${userIn3}`;
        
        if (player === 1) {
            p1Langkah++;
            p1AngkaSaatIni = solutionIn3;
            tambahLog(1, p1Langkah, logFormatText, solutionIn3);
            
            if (solutionIn3 === targetFinis) {
                // Player 1 menang instan karena mencapai target duluan!
                deklarasiHasilAkhir("P1", "PLAYER 1 (BIRU) BERHASIL MENANG!");
            } else {
                // Kosongkan dan siapkan untuk langkah berikutnya secepatnya
                aktifkanForm(1, true);
                setFokusInput(1, 'p1-in1');
            }
        } else {
            p2Langkah++;
            p2AngkaSaatIni = solutionIn3;
            tambahLog(2, p2Langkah, logFormatText, solutionIn3);
            
            if (solutionIn3 === targetFinis) {
                // Player 2 menang instan karena mencapai target duluan!
                deklarasiHasilAkhir("P2", "PLAYER 2 (MERAH) BERHASIL MENANG!");
            } else {
                // Kosongkan dan siapkan untuk langkah berikutnya secepatnya
                aktifkanForm(2, true);
                setFokusInput(2, 'p2-in1');
            }
        }
    }

    function tambahLog(player, langkah, gabunganProses, hasilAkhir) {
        let logDiv = document.getElementById(`p${player}-log`);
        let entry = document.createElement('div');
        entry.className = 'log-entry';
        
        if (hasilAkhir === targetFinis) {
            entry.className += ' win';
            let labelStatus = (modeDipilih === "happy") ? "HAPPY!" : "LOOP DETECTED!";
            entry.innerText = `Ronde ${langkah}: ${gabunganProses} (🎯 ${labelStatus})`;
        } else {
            entry.innerText = `Ronde ${langkah}: ${gabunganProses}`;
        }
        
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function showError(msg) {
        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = msg;
        errorDiv.style.background = "#e53e3e";
        errorDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('global-msg').style.display = 'none';
    }

    function deklarasiHasilAkhir(pemenang, pesan) {
        gameAktif = false;
        aktifkanForm(1, false);
        aktifkanForm(2, false);
        
        if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
        if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');

        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = `🎉 MATCH OVER: ${pesan} 🎉`;
        errorDiv.style.background = "#38a169"; // Hijau sukses
        errorDiv.style.display = 'block';
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
                document.getElementById('btnFullscreen').innerText = "❌ Keluar Fullscreen";
            }).catch(err => {
                // Silent fallback
            });
        } else {
            document.exitFullscreen().then(() => {
                document.getElementById('btnFullscreen').innerText = "💻 Fullscreen";
            });
        }
    }

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('btnFullscreen').innerText = "💻 Fullscreen";
        }
    });
</script>
</body>
</html>
