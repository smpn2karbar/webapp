<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Numbers Arena - IFP Tactile Edition with Fullscreen</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 10px; background-color: #1a202c; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; justify-content: center; align-items: center; }
        
        .game-container { background: #1a202c; width: 100%; max-width: 1200px; height: 100%; display: flex; flex-direction: column; padding: 10px; border-radius: 12px; }

        /* Header & Panel Kontrol */
        header { text-align: center; padding: 10px; background: #2d3748; border-radius: 8px; margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); position: relative; }
        h1 { margin: 0 0 6px 0; font-size: 20px; color: #f6e05e; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* Tombol Layar Penuh */
        .fullscreen-bar { position: absolute; right: 10px; top: 10px; }
        .btn-fullscreen { background: #4a5568; color: #f8fafc; border: 1px solid #718096; padding: 6px 12px; font-size: 11px; font-weight: bold; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-fullscreen:hover { background: #718096; }

        .control-panel { display: flex; justify-content: center; gap: 15px; align-items: center; background: #1a202c; padding: 6px; border-radius: 6px; }
        .control-group { display: flex; align-items: center; gap: 6px; }
        .control-label { font-weight: bold; font-size: 13px; color: #a0aec0; }
        
        .btn-toggle { padding: 6px 12px; font-size: 12px; font-weight: bold; border: 2px solid #4a5568; background: #2d3748; color: #e2e8f0; border-radius: 5px; cursor: pointer; }
        .btn-toggle.active { background: #3182ce; border-color: #2b6cb0; box-shadow: 0 0 8px rgba(49, 130, 206, 0.5); color: white; }
        .btn-difficulty.active { background: #dd6b20; border-color: #c05621; box-shadow: 0 0 8px rgba(221, 107, 32, 0.5); color: white; }
        
        #btnMulai { padding: 8px 18px; font-size: 13px; font-weight: bold; background-color: #38a169; color: white; border: none; border-radius: 5px; cursor: pointer; }

        .info-misi { font-size: 13px; color: #e2e8f0; margin-top: 5px; font-style: italic; }
        .info-misi strong { color: #48bb78; }
        #global-msg { background: #e53e3e; color: #fff; padding: 6px; border-radius: 5px; font-size: 14px; display: none; margin-top: 5px; text-align: center; font-weight: bold; }

        /* Arena Permainan 2 Player */
        .game-arena { display: flex; flex: 1; gap: 10px; min-height: 0; }
        .player-side { flex: 1; background: #2d3748; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; border: 4px solid #4a5568; min-height: 0; }
        #p1-side { border-color: #3182ce; }
        #p2-side { border-color: #e53e3e; }
        
        .player-title { text-align: center; font-size: 16px; margin-bottom: 4px; font-weight: bold; }
        #p1-side .player-title { color: #3182ce; }
        #p2-side .player-title { color: #e53e3e; }

        .start-badge { text-align: center; font-size: 26px; font-weight: bold; background: #1a202c; padding: 4px; border-radius: 6px; margin-bottom: 8px; }
        #p1-start { color: #3182ce; border: 1px solid #3182ce; }
        #p2-start { color: #e53e3e; border: 1px solid #e53e3e; }

        /* Log / Papan Tulis Langkah */
        .log-container { flex: 1; background: #1a202c; border-radius: 8px; padding: 8px; overflow-y: auto; margin-bottom: 8px; font-family: monospace; font-size: 13px; min-height: 80px; }
        .log-entry { background: #2d3748; padding: 4px 6px; margin-bottom: 4px; border-radius: 4px; border-left: 3px solid #ecc94b; }
        .log-entry.win { border-left-color: #38a169; background: #22543d; font-weight: bold; }

        /* Alur Kerja Tiga Input Matematika */
        .math-interface { background: #232d3f; padding: 10px; border-radius: 8px; border: 1px solid #4a5568; }
        .formula-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 8px; font-size: 15px; }
        
        .num-input { width: 100px; padding: 8px 4px; font-size: 14px; text-align: center; font-weight: bold; border-radius: 5px; border: 2px solid #718096; background: #fff; color: #000; }
        .num-input:focus { border-color: #ecc94b; outline: none; }
        .num-input.active-focus { border-color: #ecc94b; background-color: #feebc8; } 
        .num-input.error { border-color: #e53e3e; background-color: #fff5f5; }
        
        /* Papan Keypad Sentuh IFP */
        .ifp-keypad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 8px; }
        .key-btn { padding: 10px 0; font-size: 15px; font-weight: bold; background: #4a5568; border: none; color: white; border-radius: 4px; cursor: pointer; text-align: center; }
        .key-btn:active { background: #718096; }
        .key-btn.symbol { background: #2b6cb0; }
        .key-btn.clear { background: #c53030; }

        .btn-proses { width: 100%; padding: 10px; font-size: 14px; font-weight: bold; background: #805ad5; border: none; color: white; border-radius: 5px; cursor: pointer; }
        .btn-proses:disabled, .key-btn:disabled { background: #2d3748; color: #718096; cursor: not-allowed; }

        /* Fullscreen Mode Styles */
        .game-container:fullscreen {
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            border-radius: 0;
            padding: 20px;
            background-color: #1a202c;
        }
        .game-container:fullscreen .game-arena {
            height: calc(100vh - 160px);
        }
    </style>
</head>
<body>

<div class="game-container" id="happyArena">
    <header>
        <!-- Tombol Layar Penuh -->
        <div class="fullscreen-bar">
            <button class="btn-fullscreen" id="btnFullscreen" onclick="toggleFullscreen('happyArena')">
                <span id="fsIcon">🖥️</span> <span id="fsText">Layar Penuh</span>
            </button>
        </div>

        <h1>HAPPY NUMBERS COMPETE CENTER (TACTILE IFP VERSION)</h1>
        
        <div class="control-panel">
            <div class="control-group">
                <span class="control-label">MODE GAME:</span>
                <button class="btn-toggle active" id="modeHappy" onclick="setGameMode('happy')">HAPPY (➔ 1)</button>
                <button class="btn-toggle" id="modeUnhappy" onclick="setGameMode('unhappy')">UNHAPPY (➔ 4)</button>
            </div>
            
            <div class="control-group">
                <span class="control-label">KESULITAN:</span>
                <button class="btn-toggle btn-difficulty active" id="diff-mudah" onclick="setDifficulty('mudah')">MUDAH</button>
                <button class="btn-toggle btn-difficulty" id="diff-sedang" onclick="setDifficulty('sedang')">SEDANG</button>
                <button class="btn-toggle btn-difficulty" id="diff-sulit" onclick="setDifficulty('sulit')">SULIT</button>
            </div>
            
            <button id="btnMulai" onclick="mulaiPertandingan()">Acak Game & Mulai!</button>
        </div>
        
        <div class="info-misi" id="infoMisi">Sentuh kolom input terlebih dahulu sebelum menekan tombol angka di layar!</div>
        <div id="global-msg"></div>
    </header>

    <div class="game-arena">
        <!-- PLAYER 1 SISI KIRI -->
        <div class="player-side" id="p1-side">
            <div class="player-title">PLAYER 1 (BIRU)</div>
            <div class="start-badge" id="p1-start">??</div>
            <div class="log-container" id="p1-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p1-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(1, 'p1-in1')">
                    <span>=</span>
                    <input type="text" id="p1-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(1, 'p1-in2')">
                    <span>=</span>
                    <input type="text" id="p1-in3" class="num-input" style="width: 70px;" placeholder="Hasil" readonly onclick="setFokusInput(1, 'p1-in3')">
                </div>
                
                <!-- KEYPAD SCREEN PLAYER 1 -->
                <div class="ifp-keypad">
                    <button class="key-btn" id="p1-k1" onclick="inputKey(1, '1')" disabled>1</button>
                    <button class="key-btn" id="p1-k2" onclick="inputKey(1, '2')" disabled>2</button>
                    <button class="key-btn" id="p1-k3" onclick="inputKey(1, '3')" disabled>3</button>
                    <button class="key-btn" id="p1-k4" onclick="inputKey(1, '4')" disabled>4</button>
                    <button class="key-btn" id="p1-k5" onclick="inputKey(1, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p1-ks1" onclick="inputKey(1, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p1-k6" onclick="inputKey(1, '6')" disabled>6</button>
                    <button class="key-btn" id="p1-k7" onclick="inputKey(1, '7')" disabled>7</button>
                    <button class="key-btn" id="p1-k8" onclick="inputKey(1, '8')" disabled>8</button>
                    <button class="key-btn" id="p1-k9" onclick="inputKey(1, '9')" disabled>9</button>
                    <button class="key-btn" id="p1-k0" onclick="inputKey(1, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p1-ks2" onclick="inputKey(1, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p1-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(1)" disabled>⌫</button>
                    <button id="p1-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(1)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>

        <!-- PLAYER 2 SISI KANAN -->
        <div class="player-side" id="p2-side">
            <div class="player-title">PLAYER 2 (MERAH)</div>
            <div class="start-badge" id="p2-start">??</div>
            <div class="log-container" id="p2-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p2-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(2, 'p2-in1')">
                    <span>=</span>
                    <input type="text" id="p2-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(2, 'p2-in2')">
                    <span>=</span>
                    <input type="text" id="p2-in3" class="num-input" style="width: 70px;" placeholder="Hasil" readonly onclick="setFokusInput(2, 'p2-in3')">
                </div>
                
                <!-- KEYPAD SCREEN PLAYER 2 -->
                <div class="ifp-keypad">
                    <button class="key-btn" id="p2-k1" onclick="inputKey(2, '1')" disabled>1</button>
                    <button class="key-btn" id="p2-k2" onclick="inputKey(2, '2')" disabled>2</button>
                    <button class="key-btn" id="p2-k3" onclick="inputKey(2, '3')" disabled>3</button>
                    <button class="key-btn" id="p2-k4" onclick="inputKey(2, '4')" disabled>4</button>
                    <button class="key-btn" id="p2-k5" onclick="inputKey(2, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p2-ks1" onclick="inputKey(2, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p2-k6" onclick="inputKey(2, '6')" disabled>6</button>
                    <button class="key-btn" id="p2-k7" onclick="inputKey(2, '7')" disabled>7</button>
                    <button class="key-btn" id="p2-k8" onclick="inputKey(2, '8')" disabled>8</button>
                    <button class="key-btn" id="p2-k9" onclick="inputKey(2, '9')" disabled>9</button>
                    <button class="key-btn" id="p2-k0" onclick="inputKey(2, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p2-ks2" onclick="inputKey(2, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p2-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(2)" disabled>⌫</button>
                    <button id="p2-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(2)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const databaseHappy = {
        happy: {
            mudah:  [ {p1: "19", p2: "10"}, {p1: "7", p2: "23"}, {p1: "28", p2: "68"} ],
            sedang: [ {p1: "13", p2: "31"}, {p1: "79", p2: "97"}, {p1: "49", p2: "94"} ],
            sulit:  [ {p1: "167", p2: "263"}, {p1: "373", p2: "383"}, {p1: "473", p2: "593"} ]
        },
        unhappy: {
            mudah:  [ {p1: "4", p2: "16"}, {p1: "20", p2: "37"}, {p1: "58", p2: "89"} ],
            sedang: [ {p1: "145", p2: "42"}, {p1: "2", p2: "3"}, {p1: "5", p2: "6"} ],
            sulit:  [ {p1: "11", p2: "12"}, {p1: "14", p2: "15"}, {p1: "21", p2: "22"} ]
        }
    };

    let modeDipilih = "happy";
    let kesulitanDipilih = "mudah";
    let p1AngkaSaatIni = "";
    let p2AngkaSaatIni = "";
    let p1Langkah = 0;
    let p2Langkah = 0;
    let gameAktif = false;
    let targetFinis = "1";

    let p1InputFokus = "";
    let p2InputFokus = "";

    function toggleFullscreen(elemId) {
        const container = document.getElementById(elemId);
        const fsText = document.getElementById('fsText');
        const fsIcon = document.getElementById('fsIcon');

        if (!document.fullscreenElement) {
            container.requestFullscreen().then(() => {
                fsText.innerText = "Keluar Layar";
                fsIcon.innerText = "❌";
            }).catch(err => {
                const errorDiv = document.getElementById('global-msg');
                errorDiv.innerHTML = `⚠️ Gagal Layar Penuh! Pastikan iframe Google Sites Anda memiliki izin <strong>allowfullscreen</strong>.`;
                errorDiv.style.display = 'block';
            });
        } else {
            document.exitFullscreen();
            fsText.innerText = "Layar Penuh";
            fsIcon.innerText = "🖥️";
        }
    }

    document.addEventListener('fullscreenchange', () => {
        const fsText = document.getElementById('fsText');
        const fsIcon = document.getElementById('fsIcon');
        if (!document.fullscreenElement) {
            fsText.innerText = "Layar Penuh";
            fsIcon.innerText = "🖥️";
        }
    });

    function setGameMode(mode) {
        if (gameAktif) return;
        modeDipilih = mode;
        targetFinis = (mode === "happy") ? "1" : "4";
        document.getElementById('modeHappy').classList.toggle('active', mode === 'happy');
        document.getElementById('modeUnhappy').classList.toggle('active', mode === 'unhappy');
    }

    function setDifficulty(diff) {
        if (gameAktif) return;
        kesulitanDipilih = diff;
        document.getElementById('diff-mudah').classList.toggle('active', diff === 'mudah');
        document.getElementById('diff-sedang').classList.toggle('active', diff === 'sedang');
        document.getElementById('diff-sulit').classList.toggle('active', diff === 'sulit');
    }

    function mulaiPertandingan() {
        hideError();
        const kumpulanData = databaseHappy[modeDipilih][kesulitanDipilih];
        const opsiTerpilih = kumpulanData[Math.floor(Math.random() * kumpulanData.length)];

        p1AngkaSaatIni = opsiTerpilih.p1;
        p2AngkaSaatIni = opsiTerpilih.p2;
        p1Langkah = 0;
        p2Langkah = 0;
        gameAktif = true;

        document.getElementById('p1-start').innerText = opsiTerpilih.p1;
        document.getElementById('p2-start').innerText = opsiTerpilih.p2;

        document.getElementById('p1-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p1}</div>`;
        document.getElementById('p2-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p2}</div>`;

        setFokusInput(1, 'p1-in1');
        setFokusInput(2, 'p2-in1');

        aktifkanForm(1, true);
        aktifkanForm(2, true);
    }

    function setFokusInput(player, inputId) {
        if (!gameAktif) return;
        
        if (player === 1) {
            if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
            p1InputFokus = inputId;
        } else {
            if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');
            p2InputFokus = inputId;
        }
        document.getElementById(inputId).classList.add('active-focus');
    }

    function inputKey(player, char) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        targetElement.value += char;
    }

    function clearKey(player) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        let val = targetElement.value;
        targetElement.value = val.substring(0, val.length - 1);
    }

    function aktifkanForm(player, status) {
        document.getElementById(`p${player}-in1`).disabled = !status;
        document.getElementById(`p${player}-in2`).disabled = !status;
        document.getElementById(`p${player}-in3`).disabled = !status;
        document.getElementById(`p${player}-btn`).disabled = !status;
        document.getElementById(`p${player}-kc`).disabled = !status;
        
        for(let i=0; i<=9; i++) { document.getElementById(`p${player}-k${i}`).disabled = !status; }
        document.getElementById(`p${player}-ks1`).disabled = !status;
        document.getElementById(`p${player}-ks2`).disabled = !status;
        
        if (status) {
            document.getElementById(`p${player}-in1`).value = "";
            document.getElementById(`p${player}-in2`).value = "";
            document.getElementById(`p${player}-in3`).value = "";
        }
    }

    function eksekusiLangkah(player) {
        if (!gameAktif) return;
        hideError();

        let angkaSaatIni = (player === 1) ? p1AngkaSaatIni : p2AngkaSaatIni;
        let in1 = document.getElementById(`p${player}-in1`);
        let in2 = document.getElementById(`p${player}-in2`);
        let in3 = document.getElementById(`p${player}-in3`);

        in1.classList.remove('error');
        in2.classList.remove('error');
        in3.classList.remove('error');

        let digits = angkaSaatIni.split('');

        let kunciIn1 = digits.map(d => `${d}^2`).join('+');
        let kunciIn1Alternatif = digits.map(d => `${d}^2`).join(' + ');

        let kunciIn2 = digits.map(d => Math.pow(parseInt(d), 2)).join('+');
        let kunciIn2Alternatif = digits.map(d => Math.pow(parseInt(d), 2)).join(' + ');

        let kunciIn3 = digits.reduce((sum, d) => sum + Math.pow(parseInt(d), 2), 0).toString();

        let userIn1 = in1.value.trim();
        let userIn2 = in2.value.trim();
        let userIn3 = in3.value.trim();

        let valid = true;

        if (userIn1 !== kunciIn1 && userIn1 !== kunciIn1Alternatif) { in1.classList.add('error'); valid = false; }
        if (userIn2 !== kunciIn2 && userIn2 !== kunciIn2Alternatif) { in2.classList.add('error'); valid = false; }
        if (userIn3 !== kunciIn3) { in3.classList.add('error'); valid = false; }

        if (!valid) {
            showError(`Player ${player}: Format jabaran pangkat, hasil kuadrat, atau total penjumlahan Anda salah!`);
            return;
        }

        let logFormatText = `${userIn1} = ${userIn2} = ${userIn3}`;
        if (player === 1) {
            p1Langkah++;
            p1AngkaSaatIni = kunciIn3;
            tambahLog(1, p1Langkah, logFormatText, kunciIn3);
            if (kunciIn3 === targetFinis) deklarasiMenang(1);
            else {
                aktifkanForm(1, true);
                setFokusInput(1, 'p1-in1');
            }
        } else {
            p2Langkah++;
            p2AngkaSaatIni = kunciIn3;
            tambahLog(2, p2Langkah, logFormatText, kunciIn3);
            if (kunciIn3 === targetFinis) deklarasiMenang(2);
            else {
                aktifkanForm(2, true);
                setFokusInput(2, 'p2-in1');
            }
        }
    }

    function tambahLog(player, langkah, gabunganProses, hasilAkhir) {
        let logDiv = document.getElementById(`p${player}-log`);
        let entry = document.createElement('div');
        entry.className = 'log-entry';
        
        if (hasilAkhir === targetFinis) {
            entry.className += ' win';
            let labelStatus = (modeDipilih === "happy") ? "HAPPY!" : "LOOP DETECTED!";
            entry.innerText = `Lk ${langkah}: ${gabunganProses} (🎯 ${labelStatus})`;
        } else {
            entry.innerText = `Lk ${langkah}: ${gabunganProses}`;
        }
        
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function showError(msg) {
        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = msg;
        errorDiv.style.background = "#e53e3e";
        errorDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('global-msg').style.display = 'none';
    }

    function deklarasiMenang(player) {
        gameAktif = false;
        aktifkanForm(1, false);
        aktifkanForm(2, false);
        
        if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
        if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');

        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = `🎉 PERTANDINGAN SELESAI: PLAYER ${player} MENANG! 🎉`;
        errorDiv.style.background = "#38a169";
        errorDiv.style.display = 'block';
    }
</script>
</body>
</html>
