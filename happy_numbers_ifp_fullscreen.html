<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Numbers & Kaprekar Arena - IFP Tactile Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #111827; 
            color: #fff; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        header { 
            text-align: center; 
            padding: 12px; 
            background: #1f2937; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.4); 
            border: 1px solid #374151;
        }
        h1 { 
            margin: 0 0 6px 0; 
            font-size: 20px; 
            color: #f59e0b; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5); 
            font-weight: 800;
            letter-spacing: 1px;
        }
        
        .control-panel { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            align-items: center; 
            background: #111827; 
            padding: 8px; 
            border-radius: 6px; 
            flex-wrap: wrap;
            border: 1px solid #374151;
        }
        .control-group { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }
        .control-label { 
            font-weight: bold; 
            font-size: 13px; 
            color: #9ca3af; 
        }
        
        .btn-toggle { 
            padding: 6px 12px; 
            font-size: 12px; 
            font-weight: bold; 
            border: 2px solid #4b5563; 
            background: #1f2937; 
            color: #f3f4f6; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .btn-toggle:hover {
            background-color: #4b5563;
        }
        .btn-toggle.active { 
            background: #2563eb; 
            border-color: #3b82f6; 
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.6); 
        }
        .btn-toggle.btn-difficulty.active { 
            background: #ea580c; 
            border-color: #f97316; 
            box-shadow: 0 0 8px rgba(234, 88, 12, 0.6); 
        }
        
        .btn-action {
            padding: 8px 16px; 
            font-size: 13px; 
            font-weight: bold; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
        }
        .btn-action:active {
            transform: scale(0.95);
        }
        #btnMulai { 
            background-color: #16a34a; 
            color: white; 
        }
        #btnMulai:hover {
            background-color: #15803d;
        }
        #btnReset {
            background-color: #4b5563;
            color: white;
        }
        #btnReset:hover {
            background-color: #374151;
        }
        #btnFullscreen {
            background-color: #1f2937;
            color: #fbbf24;
            border: 1px solid #fbbf24;
        }
        #btnFullscreen:hover {
            background-color: #111827;
        }

        .info-misi { 
            font-size: 13px; 
            color: #d1d5db; 
            margin-top: 5px; 
            font-style: italic; 
        }
        #global-msg { 
            background: #16a34a; 
            color: #fff; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 15px; 
            display: none; 
            margin-top: 6px; 
            text-align: center; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px dashed #ffffff;
        }

        .game-arena { 
            display: flex; 
            flex: 1; 
            gap: 12px; 
            height: 65vh; 
        }
        .player-side { 
            flex: 1; 
            background: #1f2937; 
            border-radius: 12px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            border: 4px solid #4b5563; 
            position: relative;
            transition: all 0.3s ease;
        }
        #p1-side { border-color: #2563eb; }
        #p2-side { border-color: #dc2626; }
        
        .player-title { 
            text-align: center; 
            font-size: 16px; 
            margin-bottom: 4px; 
            font-weight: bold; 
            letter-spacing: 1px;
        }
        #p1-side .player-title { color: #60a5fa; }
        #p2-side .player-title { color: #f87171; }

        .start-badge { 
            text-align: center; 
            font-size: 28px; 
            font-weight: bold; 
            background: #111827; 
            padding: 6px; 
            border-radius: 6px; 
            margin-bottom: 8px; 
        }
        #p1-start { color: #60a5fa; border: 2px solid #2563eb; }
        #p2-start { color: #f87171; border: 2px solid #dc2626; }

        /* Log / Papan Tulis Langkah */
        .log-container { 
            flex: 1; 
            background: #111827; 
            border-radius: 8px; 
            padding: 8px; 
            overflow-y: auto; 
            margin-bottom: 8px; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 13px; 
            min-height: 80px; 
            border: 1px solid #4b5563;
        }
        .log-entry { 
            background: #1f2937; 
            padding: 4px 6px; 
            margin-bottom: 4px; 
            border-radius: 4px; 
            border-left: 3px solid #fbbf24; 
        }
        .log-entry.win { 
            border-left-color: #16a34a; 
            background: #14532d; 
            font-weight: bold; 
        }

        .math-interface { 
            background: #111827; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #4b5563; 
        }
        .formula-row { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            margin-bottom: 8px; 
            font-size: 16px; 
            font-weight: bold;
        }
        .formula-row span {
            color: #fbbf24;
        }
        
        .num-input { 
            width: 110px; 
            padding: 8px 4px; 
            font-size: 14px; 
            text-align: center; 
            font-weight: bold; 
            border-radius: 5px; 
            border: 2px solid #4b5563; 
            background: #fff; 
            color: #000; 
            cursor: pointer;
        }
        .num-input:focus { 
            border-color: #f59e0b; 
            outline: none; 
        }
        .num-input.active-focus { 
            border-color: #f59e0b; 
            background-color: #fef3c7; 
            box-shadow: 0 0 8px #f59e0b;
        }
        .num-input.error { 
            border-color: #dc2626; 
            background-color: #fee2e2; 
            animation: shake 0.3s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .ifp-keypad { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 4px; 
            margin-bottom: 8px; 
        }
        .key-btn { 
            padding: 12px 0; 
            font-size: 16px; 
            font-weight: bold; 
            background: #374151; 
            border: none; 
            color: white; 
            border-radius: 4px; 
            cursor: pointer; 
            text-align: center; 
            user-select: none;
            touch-action: manipulation;
        }
        .key-btn:active { 
            background: #4b5563; 
        }
        .key-btn.symbol { 
            background: #1d4ed8; 
        }
        .key-btn.symbol:active {
            background: #1e40af;
        }
        .key-btn.clear { 
            background: #991b1b; 
        }
        .key-btn.clear:active {
            background: #7f1d1d;
        }

        .btn-proses { 
            width: 100%; 
            padding: 12px; 
            font-size: 14px; 
            font-weight: bold; 
            background: #6d28d9; 
            border: none; 
            color: white; 
            border-radius: 5px; 
            cursor: pointer; 
            touch-action: manipulation;
        }
        .btn-proses:active {
            background: #5b21b6;
        }
        .btn-proses:disabled, .key-btn:disabled { 
            background: #1f2937; 
            color: #4b5563; 
            cursor: not-allowed; 
        }
    </style>
</head>
<body>

    <header>
        <h1>HAPPY NUMBERS & KAPREKAR ARENA (TACTILE IFP VERSION)</h1>
        
        <div class="control-panel">
            <!-- Game Category Selection -->
            <div class="control-group">
                <span class="control-label">KATEGORI:</span>
                <button class="btn-toggle active" id="catHappy" onclick="setCategory('happy')">HAPPY NUMBERS</button>
                <button class="btn-toggle" id="catKaprekar" onclick="setCategory('kaprekar')">KAPREKAR CONSTANT</button>
            </div>

            <!-- Happy Game Modes -->
            <div class="control-group" id="group-modes-happy">
                <span class="control-label">MODE:</span>
                <button class="btn-toggle active" id="modeHappy" onclick="setGameMode('happy')">HAPPY (➔ 1)</button>
                <button class="btn-toggle" id="modeUnhappy" onclick="setGameMode('unhappy')">UNHAPPY (➔ 4)</button>
            </div>

            <!-- Kaprekar Game Modes -->
            <div class="control-group hidden" id="group-modes-kaprekar">
                <span class="control-label">DIGIT:</span>
                <button class="btn-toggle" id="modeKap3" onclick="setGameMode('kap3')">3 DIGIT (➔ 495)</button>
                <button class="btn-toggle" id="modeKap4" onclick="setGameMode('kap4')">4 DIGIT (➔ 6174)</button>
            </div>
            
            <!-- Difficulty -->
            <div class="control-group">
                <span class="control-label">KESULITAN:</span>
                <button class="btn-toggle btn-difficulty active" id="diff-mudah" onclick="setDifficulty('mudah')">MUDAH</button>
                <button class="btn-toggle btn-difficulty" id="diff-sedang" onclick="setDifficulty('sedang')">SEDANG</button>
                <button class="btn-toggle btn-difficulty" id="diff-sulit" onclick="setDifficulty('sulit')">SULIT</button>
            </div>
            
            <button id="btnMulai" class="btn-action" onclick="mulaiPertandingan()">Acak Game & Mulai!</button>
            <button id="btnReset" class="btn-action" onclick="resetGame()">Reset</button>
            <button id="btnFullscreen" class="btn-action" onclick="toggleFullscreen()">💻 Fullscreen</button>
        </div>
        
        <div class="info-misi" id="infoMisi">Kedua pemain mendapat angka berbeda tetapi memiliki total langkah penyelesaian yang sama persis (Fair Play). Siapa cepat dia menang!</div>
        <div id="global-msg"></div>
    </header>

    <div class="game-arena">
        <!-- PLAYER 1 -->
        <div class="player-side" id="p1-side">
            <div class="player-title">PLAYER 1 (BIRU)</div>
            <div class="start-badge" id="p1-start">??</div>
            <div class="log-container" id="p1-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p1-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(1, 'p1-in1')">
                    <span id="p1-sep1">=</span>
                    <input type="text" id="p1-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(1, 'p1-in2')">
                    <span id="p1-sep2">=</span>
                    <input type="text" id="p1-in3" class="num-input" style="width: 80px;" placeholder="Hasil" readonly onclick="setFokusInput(1, 'p1-in3')">
                </div>
                
                <div class="ifp-keypad">
                    <button class="key-btn" id="p1-k1" onclick="inputKey(1, '1')" disabled>1</button>
                    <button class="key-btn" id="p1-k2" onclick="inputKey(1, '2')" disabled>2</button>
                    <button class="key-btn" id="p1-k3" onclick="inputKey(1, '3')" disabled>3</button>
                    <button class="key-btn" id="p1-k4" onclick="inputKey(1, '4')" disabled>4</button>
                    <button class="key-btn" id="p1-k5" onclick="inputKey(1, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p1-ks1" onclick="inputKey(1, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p1-k6" onclick="inputKey(1, '6')" disabled>6</button>
                    <button class="key-btn" id="p1-k7" onclick="inputKey(1, '7')" disabled>7</button>
                    <button class="key-btn" id="p1-k8" onclick="inputKey(1, '8')" disabled>8</button>
                    <button class="key-btn" id="p1-k9" onclick="inputKey(1, '9')" disabled>9</button>
                    <button class="key-btn" id="p1-k0" onclick="inputKey(1, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p1-ks2" onclick="inputKey(1, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p1-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(1)" disabled>Hapus</button>
                    <button id="p1-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(1)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>

        <!-- PLAYER 2 -->
        <div class="player-side" id="p2-side">
            <div class="player-title">PLAYER 2 (MERAH)</div>
            <div class="start-badge" id="p2-start">??</div>
            <div class="log-container" id="p2-log"></div>
            
            <div class="math-interface">
                <div class="formula-row">
                    <input type="text" id="p2-in1" class="num-input" placeholder="Pangkat (^)" readonly onclick="setFokusInput(2, 'p2-in1')">
                    <span id="p2-sep1">=</span>
                    <input type="text" id="p2-in2" class="num-input" placeholder="Kuadrat (+)" readonly onclick="setFokusInput(2, 'p2-in2')">
                    <span id="p2-sep2">=</span>
                    <input type="text" id="p2-in3" class="num-input" style="width: 80px;" placeholder="Hasil" readonly onclick="setFokusInput(2, 'p2-in3')">
                </div>
                
                <div class="ifp-keypad">
                    <button class="key-btn" id="p2-k1" onclick="inputKey(2, '1')" disabled>1</button>
                    <button class="key-btn" id="p2-k2" onclick="inputKey(2, '2')" disabled>2</button>
                    <button class="key-btn" id="p2-k3" onclick="inputKey(2, '3')" disabled>3</button>
                    <button class="key-btn" id="p2-k4" onclick="inputKey(2, '4')" disabled>4</button>
                    <button class="key-btn" id="p2-k5" onclick="inputKey(2, '5')" disabled>5</button>
                    <button class="key-btn symbol" id="p2-ks1" onclick="inputKey(2, '^')" disabled>^</button>
                    
                    <button class="key-btn" id="p2-k6" onclick="inputKey(2, '6')" disabled>6</button>
                    <button class="key-btn" id="p2-k7" onclick="inputKey(2, '7')" disabled>7</button>
                    <button class="key-btn" id="p2-k8" onclick="inputKey(2, '8')" disabled>8</button>
                    <button class="key-btn" id="p2-k9" onclick="inputKey(2, '9')" disabled>9</button>
                    <button class="key-btn" id="p2-k0" onclick="inputKey(2, '0')" disabled>0</button>
                    <button class="key-btn symbol" id="p2-ks2" onclick="inputKey(2, '+')" disabled>+</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="key-btn clear" id="p2-kc" style="flex: 1; padding: 6px 0;" onclick="clearKey(2)" disabled>Hapus</button>
                    <button id="p2-btn" class="btn-proses" style="flex: 2;" onclick="eksekusiLangkah(2)" disabled>Simpan Langkah</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // Database Happy/Unhappy (di-upgrade agar asimetris & presisi langkah)
    const databaseHappy = {
        happy: {
            mudah:  [ 
                {p1: "13", p2: "68"},   // 2 langkah ke 1
                {p1: "23", p2: "28"},   // 3 langkah ke 1
                {p1: "103", p2: "31"}   // 2 langkah ke 1
            ],
            sedang: [ 
                {p1: "19", p2: "44"},   // 4 langkah ke 1
                {p1: "49", p2: "188"},  // 4 langkah ke 1
                {p1: "7", p2: "133"}    // 5 langkah ke 1
            ],
            sulit:  [ 
                {p1: "356", p2: "469"},  // 6 langkah ke 1
                {p1: "379", p2: "649"}   // 6 langkah ke 1
            ]
        },
        unhappy: {
            mudah:  [ 
                {p1: "11", p2: "24"},   // 2 langkah ke 4
                {p1: "110", p2: "42"},  // 2 langkah ke 4
                {p1: "145", p2: "311"}  // 3 langkah ke 4
            ],
            sedang: [ 
                {p1: "89", p2: "179"},  // 4 langkah ke 4
                {p1: "449", p2: "98"},  // 4 langkah ke 4
                {p1: "58", p2: "977"}   // 5 langkah ke 4
            ],
            sulit:  [ 
                {p1: "37", p2: "92"},   // 6 langkah ke 4
                {p1: "16", p2: "52"}    // 7 langkah ke 4
            ]
        }
    };

    // Database Kaprekar (Fully balanced step counts, no anagrams/reverses)
    const databaseKaprekar = {
        3: { // Target 495
            mudah:  [ 
                {p1: "541", p2: "831"},   // 3 langkah ke 495
                {p1: "652", p2: "942"}    // 3 langkah ke 495
            ],
            sedang: [ 
                {p1: "421", p2: "860"},   // 4 langkah ke 495
                {p1: "532", p2: "971"}    // 4 langkah ke 495
            ],
            sulit:  [ 
                {p1: "322", p2: "877"},   // 6 langkah ke 495
                {p1: "211", p2: "766"}    // 6 langkah ke 495
            ]
        },
        4: { // Target 6174
            mudah:  [ 
                {p1: "3524", p2: "5433"}, // 3 langkah ke 6174
                {p1: "6433", p2: "6544"}  // 3 langkah ke 6174
            ],
            sedang: [ 
                {p1: "7454", p2: "8766"}, // 4 langkah ke 6174
                {p1: "2111", p2: "3222"}  // 5 langkah ke 6174
            ],
            sulit:  [ 
                {p1: "6331", p2: "7442"}, // 6 langkah ke 6174
                {p1: "6753", p2: "3987"}  // 7 langkah ke 6174
            ]
        }
    };

    let kategoriDipilih = "happy";
    let modeDipilih = "happy";
    let kesulitanDipilih = "mudah";
    
    // Status Permainan Independen
    let p1AngkaSaatIni = "";
    let p2AngkaSaatIni = "";
    let p1Langkah = 0;
    let p2Langkah = 0;
    let gameAktif = false;
    let targetFinis = "1";

    let p1InputFokus = "";
    let p2InputFokus = "";

    function setCategory(cat) {
        if (gameAktif) return;
        kategoriDipilih = cat;
        document.getElementById('catHappy').classList.toggle('active', cat === 'happy');
        document.getElementById('catKaprekar').classList.toggle('active', cat === 'kaprekar');
        
        if (cat === 'happy') {
            document.getElementById('group-modes-happy').classList.remove('hidden');
            document.getElementById('group-modes-kaprekar').classList.add('hidden');
            setGameMode('happy');
        } else {
            document.getElementById('group-modes-happy').classList.add('hidden');
            document.getElementById('group-modes-kaprekar').classList.remove('hidden');
            setGameMode('kap3');
        }
        updateUIForCategory();
    }

    function setGameMode(mode) {
        if (gameAktif) return;
        modeDipilih = mode;
        
        if (kategoriDipilih === "happy") {
            targetFinis = (mode === "happy") ? "1" : "4";
            document.getElementById('modeHappy').classList.toggle('active', mode === 'happy');
            document.getElementById('modeUnhappy').classList.toggle('active', mode === 'unhappy');
        } else {
            targetFinis = (mode === "kap3") ? "495" : "6174";
            document.getElementById('modeKap3').classList.toggle('active', mode === 'kap3');
            document.getElementById('modeKap4').classList.toggle('active', mode === 'kap4');
        }
    }

    function setDifficulty(diff) {
        if (gameAktif) return;
        kesulitanDipilih = diff;
        document.getElementById('diff-mudah').classList.toggle('active', diff === 'mudah');
        document.getElementById('diff-sedang').classList.toggle('active', diff === 'sedang');
        document.getElementById('diff-sulit').classList.toggle('active', diff === 'sulit');
    }

    function updateUIForCategory() {
        let isHappy = (kategoriDipilih === "happy");
        let infoMisi = document.getElementById('infoMisi');
        
        if (isHappy) {
            infoMisi.innerText = "Kedua pemain mendapat angka berbeda tetapi memiliki total langkah penyelesaian yang sama persis (Fair Play). Siapa cepat dia menang!";
        } else {
            infoMisi.innerText = "Urutkan digit dari besar ke kecil (Desc), kurangi dengan urutan kecil ke besar (Asc) untuk mencapai Konstanta Kaprekar!";
        }

        // Update separators
        document.getElementById('p1-sep1').innerText = isHappy ? '=' : '-';
        document.getElementById('p1-sep2').innerText = isHappy ? '=' : '=';
        document.getElementById('p2-sep1').innerText = isHappy ? '=' : '-';
        document.getElementById('p2-sep2').innerText = isHappy ? '=' : '=';
        
        // Update placeholders
        document.getElementById('p1-in1').placeholder = isHappy ? 'Pangkat (^)' : 'Besar (Desc)';
        document.getElementById('p1-in2').placeholder = isHappy ? 'Kuadrat (+)' : 'Kecil (Asc)';
        document.getElementById('p1-in3').placeholder = isHappy ? 'Hasil' : 'Selisih (-)';
        
        document.getElementById('p2-in1').placeholder = isHappy ? 'Pangkat (^)' : 'Besar (Desc)';
        document.getElementById('p2-in2').placeholder = isHappy ? 'Kuadrat (+)' : 'Kecil (Asc)';
        document.getElementById('p2-in3').placeholder = isHappy ? 'Hasil' : 'Selisih (-)';
    }

    function mulaiPertandingan() {
        hideError();
        let opsiTerpilih;
        
        if (kategoriDipilih === "happy") {
            const kumpulanData = databaseHappy[modeDipilih][kesulitanDipilih];
            opsiTerpilih = kumpulanData[Math.floor(Math.random() * kumpulanData.length)];
        } else {
            let numDigits = (modeDipilih === 'kap3') ? 3 : 4;
            const kumpulanData = databaseKaprekar[numDigits][kesulitanDipilih];
            opsiTerpilih = kumpulanData[Math.floor(Math.random() * kumpulanData.length)];
        }

        p1AngkaSaatIni = opsiTerpilih.p1;
        p2AngkaSaatIni = opsiTerpilih.p2;
        p1Langkah = 0;
        p2Langkah = 0;
        gameAktif = true;

        document.getElementById('p1-start').innerText = opsiTerpilih.p1;
        document.getElementById('p2-start').innerText = opsiTerpilih.p2;

        document.getElementById('p1-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p1}</div>`;
        document.getElementById('p2-log').innerHTML = `<div class='log-entry'>Angka Awal: ${opsiTerpilih.p2}</div>`;

        // Atur fokus default awal ke kolom pertama masing-masing player
        setFokusInput(1, 'p1-in1');
        setFokusInput(2, 'p2-in1');

        aktifkanForm(1, true);
        aktifkanForm(2, true);
        
        document.getElementById('btnReset').disabled = false;
    }

    function resetGame() {
        gameAktif = false;
        p1AngkaSaatIni = "";
        p2AngkaSaatIni = "";
        p1Langkah = 0;
        p2Langkah = 0;

        document.getElementById('p1-start').innerText = "??";
        document.getElementById('p2-start').innerText = "??";
        document.getElementById('p1-log').innerHTML = "";
        document.getElementById('p2-log').innerHTML = "";

        // Bersihkan input fokus
        if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
        if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');
        p1InputFokus = "";
        p2InputFokus = "";

        aktifkanForm(1, false);
        aktifkanForm(2, false);
        
        // Bersihkan nilai kolom input
        document.getElementById("p1-in1").value = "";
        document.getElementById("p1-in2").value = "";
        document.getElementById("p1-in3").value = "";
        document.getElementById("p2-in1").value = "";
        document.getElementById("p2-in2").value = "";
        document.getElementById("p2-in3").value = "";

        hideError();
    }

    function setFokusInput(player, inputId) {
        if (!gameAktif) return;

        // Hapus tanda aktif lama
        if (player === 1) {
            if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
            p1InputFokus = inputId;
        } else {
            if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');
            p2InputFokus = inputId;
        }
        // Beri tanda warna ke kolom baru yang dipilih
        document.getElementById(inputId).classList.add('active-focus');
    }

    // Fungsi menangkap ketukan tombol virtual keypad layar IFP
    function inputKey(player, char) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        targetElement.value += char;
    }

    function clearKey(player) {
        let inputTargetId = (player === 1) ? p1InputFokus : p2InputFokus;
        if (!inputTargetId) return;
        
        let targetElement = document.getElementById(inputTargetId);
        let val = targetElement.value;
        targetElement.value = val.substring(0, val.length - 1); // Hapus karakter terakhir
    }

    function aktifkanForm(player, status) {
        document.getElementById(`p${player}-in1`).disabled = !status;
        document.getElementById(`p${player}-in2`).disabled = !status;
        document.getElementById(`p${player}-in3`).disabled = !status;
        document.getElementById(`p${player}-btn`).disabled = !status;
        document.getElementById(`p${player}-kc`).disabled = !status;
        
        // Aktifkan / Nonaktifkan tombol keypad numerik
        for(let i=0; i<=9; i++) { 
            document.getElementById(`p${player}-k${i}`).disabled = !status; 
        }
        
        let isHappy = (kategoriDipilih === "happy");
        document.getElementById(`p${player}-ks1`).disabled = !status || !isHappy;
        document.getElementById(`p${player}-ks2`).disabled = !status || !isHappy;
        
        if (status) {
            document.getElementById(`p${player}-in1`).value = "";
            document.getElementById(`p${player}-in2`).value = "";
            document.getElementById(`p${player}-in3`).value = "";
            document.getElementById(`p${player}-in1`).classList.remove('error');
            document.getElementById(`p${player}-in2`).classList.remove('error');
            document.getElementById(`p${player}-in3`).classList.remove('error');
        }
    }

    function eksekusiLangkah(player) {
        if (!gameAktif) return;
        hideError();

        let angkaSaatIni = (player === 1) ? p1AngkaSaatIni : p2AngkaSaatIni;
        let in1 = document.getElementById(`p${player}-in1`);
        let in2 = document.getElementById(`p${player}-in2`);
        let in3 = document.getElementById(`p${player}-in3`);

        in1.classList.remove('error');
        in2.classList.remove('error');
        in3.classList.remove('error');

        let userIn1 = in1.value.trim();
        let userIn2 = in2.value.trim();
        let userIn3 = in3.value.trim();

        let nextNumber = "";
        let logFormatText = "";
        let valid = true;

        if (kategoriDipilih === "happy") {
            let digits = angkaSaatIni.split('');

            // 1. Kunci Jawaban Input 1 (Jabaran Pangkat, e.g., "1^2+9^2" atau "7^2")
            let solutionIn1 = digits.map(d => `${d}^2`).join('+');
            let solutionIn1Alt = digits.map(d => `${d}^2`).join(' + ');

            // 2. Kunci Jawaban Input 2 (Hasil Kuadrat Individu, e.g., "1+81" atau "49")
            let solutionIn2 = digits.map(d => Math.pow(parseInt(d), 2)).join('+');
            let solutionIn2Alt = digits.map(d => Math.pow(parseInt(d), 2)).join(' + ');

            // 3. Kunci Jawaban Input 3 (Total Akhir Penjumlahan, e.g., "82" atau "49")
            let solutionIn3 = digits.reduce((sum, d) => sum + Math.pow(parseInt(d), 2), 0).toString();

            if (userIn1 !== solutionIn1 && userIn1 !== solutionIn1Alt) { in1.classList.add('error'); valid = false; }
            if (userIn2 !== solutionIn2 && userIn2 !== solutionIn2Alt) { in2.classList.add('error'); valid = false; }
            if (userIn3 !== solutionIn3) { in3.classList.add('error'); valid = false; }

            if (!valid) {
                showError(`Formula Player ${player} belum tepat!`);
                return;
            }

            nextNumber = solutionIn3;
            logFormatText = `${userIn1} = ${userIn2} = ${userIn3}`;

        } else {
            // Kaprekar Mode
            let digitLength = (modeDipilih === 'kap3') ? 3 : 4;
            let paddedNum = angkaSaatIni.padStart(digitLength, '0');
            let sortedDesc = paddedNum.split('').sort((a,b)=>b-a).join('');
            let sortedAsc = paddedNum.split('').sort((a,b)=>a-b).join('');
            let diffNum = (parseInt(sortedDesc) - parseInt(sortedAsc)).toString().padStart(digitLength, '0');

            // Cocokkan input (Mendukung input dengan / tanpa leading zeros agar anak-anak tidak kesulitan)
            let isDescValid = (userIn1 === sortedDesc || parseInt(userIn1) === parseInt(sortedDesc));
            let isAscValid = (userIn2 === sortedAsc || parseInt(userIn2) === parseInt(sortedAsc));
            let isDiffValid = (userIn3 === diffNum || parseInt(userIn3) === parseInt(diffNum));

            if (!isDescValid) { in1.classList.add('error'); valid = false; }
            if (!isAscValid) { in2.classList.add('error'); valid = false; }
            if (!isDiffValid) { in3.classList.add('error'); valid = false; }

            if (!valid) {
                showError(`Langkah Kaprekar Player ${player} belum tepat! Urutkan digit dari terbesar ke terkecil (Desc), terkecil ke terbesar (Asc), lalu hitung selisihnya.`);
                return;
            }

            nextNumber = diffNum;
            logFormatText = `${userIn1} - ${userIn2} = ${userIn3}`;
        }

        // Skenario Adu Kecepatan Murni: Siapa cepat mencapai target langsung menang!
        if (player === 1) {
            p1Langkah++;
            p1AngkaSaatIni = nextNumber;
            tambahLog(1, p1Langkah, logFormatText, nextNumber);
            
            if (nextNumber === targetFinis) {
                deklarasiHasilAkhir("P1", "PLAYER 1 (BIRU) BERHASIL MENANG!");
            } else {
                aktifkanForm(1, true);
                setFokusInput(1, 'p1-in1');
            }
        } else {
            p2Langkah++;
            p2AngkaSaatIni = nextNumber;
            tambahLog(2, p2Langkah, logFormatText, nextNumber);
            
            if (nextNumber === targetFinis) {
                deklarasiHasilAkhir("P2", "PLAYER 2 (MERAH) BERHASIL MENANG!");
            } else {
                aktifkanForm(2, true);
                setFokusInput(2, 'p2-in1');
            }
        }
    }

    function tambahLog(player, langkah, gabunganProses, hasilAkhir) {
        let logDiv = document.getElementById(`p${player}-log`);
        let entry = document.createElement('div');
        entry.className = 'log-entry';
        
        if (hasilAkhir === targetFinis) {
            entry.className += ' win';
            let labelStatus = "";
            if (kategoriDipilih === "happy") {
                labelStatus = (modeDipilih === "happy") ? "HAPPY!" : "LOOP DETECTED!";
            } else {
                labelStatus = "KAPREKAR CONSTANT!";
            }
            entry.innerText = `Ronde ${langkah}: ${gabunganProses} (🎯 ${labelStatus})`;
        } else {
            entry.innerText = `Ronde ${langkah}: ${gabunganProses}`;
        }
        
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function showError(msg) {
        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = msg;
        errorDiv.style.background = "#dc2626";
        errorDiv.style.display = 'block';
    }

    function hideError() {
        document.getElementById('global-msg').style.display = 'none';
    }

    function deklarasiHasilAkhir(pemenang, pesan) {
        gameAktif = false;
        aktifkanForm(1, false);
        aktifkanForm(2, false);
        
        if (p1InputFokus) document.getElementById(p1InputFokus).classList.remove('active-focus');
        if (p2InputFokus) document.getElementById(p2InputFokus).classList.remove('active-focus');

        const errorDiv = document.getElementById('global-msg');
        errorDiv.innerText = `🎉 MATCH OVER: ${pesan} 🎉`;
        errorDiv.style.background = "#16a34a"; // Hijau sukses
        errorDiv.style.display = 'block';
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
                document.getElementById('btnFullscreen').innerText = "❌ Keluar Fullscreen";
            }).catch(err => {
                // Silent fallback
            });
        } else {
            document.exitFullscreen().then(() => {
                document.getElementById('btnFullscreen').innerText = "💻 Fullscreen";
            });
        }
    }

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            document.getElementById('btnFullscreen').innerText = "💻 Fullscreen";
        }
    });
</script>
</body>
